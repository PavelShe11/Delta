[versions]
agp = "9.2.1"
junit = "4.13.2"
kotlinxCoroutinesTest = "1.11.0"
kotlinxSerializationJson = "1.11.0"
sqldelight = "2.3.2"
coreKtx = "1.10.1"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.4.0"
composeBom = "2026.05.01"
essenty = "2.5.0"
decompose = "3.5.0"
mvikotlin = "4.4.0"
latex = "1.4.7"
haze = "1.7.2"
sqliteDriver = "2.3.2"
tracer = "1.3.3"
metro = "1.4.0"
fastexcel = "0.20.2"
desugarJdkLibs = "2.1.5"
javaxMail = "1.6.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
essenty-lifecycle-coroutines = { module = "com.arkivanov.essenty:lifecycle-coroutines", version.ref = "essenty" }
essenty-back-handler = { module = "com.arkivanov.essenty:back-handler", version.ref = "essenty" }
decompose = { group = "com.arkivanov.decompose", name = "decompose", version.ref = "decompose" }
decompose-extensions-compose = { group = "com.arkivanov.decompose", name = "extensions-compose", version.ref = "decompose" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
mvikotlin = { group = "com.arkivanov.mvikotlin", name = "mvikotlin", version.ref = "mvikotlin" }
mvikotlin-main = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-main", version.ref = "mvikotlin" }
mvikotlin-coroutines = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-extensions-coroutines", version.ref = "mvikotlin" }
mvikotlin-logging = { group = "com.arkivanov.mvikotlin", name = "mvikotlin-logging", version.ref = "mvikotlin" }
latex-base     = { module = "io.github.huarangmeng:latex-base",     version.ref = "latex" }
latex-parser   = { module = "io.github.huarangmeng:latex-parser",   version.ref = "latex" }
latex-renderer = { module = "io.github.huarangmeng:latex-renderer", version.ref = "latex" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
sqldelight-android-driver = { group = "app.cash.sqldelight", name = "android-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqliteDriver" }
tracer-crash-report = { module = "ru.ok.tracer:tracer-crash-report", version.ref = "tracer" }
tracer-disk-usage = { module = "ru.ok.tracer:tracer-disk-usage", version.ref = "tracer" }
tracer-heap-dumps = { module = "ru.ok.tracer:tracer-heap-dumps", version.ref = "tracer" }
tracer-crash-report-native = { module = "ru.ok.tracer:tracer-crash-report-native", version.ref = "tracer" }
tracer-platform = { module = "ru.ok.tracer:tracer-platform", version.ref = "tracer" }
tracer-profiler-sampling = { module = "ru.ok.tracer:tracer-profiler-sampling", version.ref = "tracer" }
tracer-profiler-systrace = { module = "ru.ok.tracer:tracer-profiler-systrace", version.ref = "tracer" }
fastexcel = { group = "org.dhatim", name = "fastexcel", version.ref = "fastexcel" }
fastexcel-reader = { group = "org.dhatim", name = "fastexcel-reader", version.ref = "fastexcel" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
android-mail = { group = "com.sun.mail", name = "android-mail", version.ref = "javaxMail" }
android-activation = { group = "com.sun.mail", name = "android-activation", version.ref = "javaxMail" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
tracer = { id = "ru.ok.tracer", version.ref = "tracer"}
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
